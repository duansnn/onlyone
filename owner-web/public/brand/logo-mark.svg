<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="日用铺">
  <defs>
    <linearGradient id="rypTile" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#ffa564"/>
      <stop offset="0.48" stop-color="#ff6a2b"/>
      <stop offset="1" stop-color="#ea4210"/>
    </linearGradient>
    <clipPath id="rypClip"><rect width="96" height="96" rx="26"/></clipPath>
  </defs>

  <g clip-path="url(#rypClip)">
    <rect width="96" height="96" rx="26" fill="url(#rypTile)"/>
    <ellipse cx="26" cy="8" rx="46" ry="34" fill="#ffffff" opacity="0.14"/>
  </g>

  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- 屋顶：既是「日」的顶横，也是屋檐 -->
    <path d="M21.5 41.5 48 18l26.5 23.5" stroke-width="9"/>
    <!-- 墙体：日的外框（左右竖 + 底横） -->
    <path d="M31 40v32a7 7 0 0 0 7 7h20a7 7 0 0 0 7-7V40" stroke-width="9"/>
    <!-- 日的中横 -->
    <path d="M31 59.5h34" stroke-width="9"/>
  </g>
</svg>
