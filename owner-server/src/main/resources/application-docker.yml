# ======================================================================
#  容器环境（docker-compose 使用）
#  MySQL / Redis 均为 compose 中的服务名
# ======================================================================
spring:
  datasource:
    dynamic:
      datasource:
        master:
          url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:owner}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
          username: ${MYSQL_USERNAME:root}
          password: ${MYSQL_PASSWORD:change-me}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:change-me}
      database: 0
  quartz:
    jdbc:
      initialize-schema: never

# ----------------------------------------------------------------------
# 电商开关：容器环境保持与生产一致的保守默认值
#  - 支付未接入     -> 顾客端下单停在「待确认」，由商家后台「确认收款」，绝不假装成功
#  - 短信未接通道   -> 验证码只写日志，不回显给前端
# ----------------------------------------------------------------------
owner:
  mall:
    sms:
      expose-code: ${OWNER_SMS_EXPOSE_CODE:false}

logging:
  level:
    root: info
    com.owner: info
