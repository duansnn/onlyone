# ======================================================================
#  Owner 日用铺电商系统 —— 公共配置
#  Spring Boot 4.1.0 / JDK 25
# ======================================================================
server:
  port: 41452
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    uri-encoding: UTF-8
    threads:
      max: 200
      min-spare: 20
    max-connections: 8192
    accept-count: 200
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain,text/css,application/javascript
    min-response-size: 2KB

spring:
  application:
    name: owner-server
  config:
    # 本地根目录的 .env（已被 .gitignore 排除）会作为配置源加载，
    # 因此口令等敏感值只需写在 .env，不会进入代码仓库。文件不存在时自动跳过。
    import: optional:file:./.env[.properties]
  profiles:
    active: local
  lifecycle:
    timeout-per-shutdown-phase: 30s
  main:
    allow-bean-definition-overriding: true
  # Spring Boot 4 使用 Jackson 3，日期时间默认按 ISO-8601 输出
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: always
    deserialization:
      fail-on-unknown-properties: false
  mvc:
    throw-exception-if-no-handler-found: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 100MB

  # ------------------------------------------------------------------
  # 数据源：Druid 1.2.28 + 动态数据源 4.5.0
  # 由 dynamic-datasource 接管 DataSource，故排除 Druid 自带的自动配置
  # ------------------------------------------------------------------
  autoconfigure:
    exclude:
      - com.alibaba.druid.spring.boot4.autoconfigure.DruidDataSourceAutoConfigure
      # Knife4j 4.5.0 的自动配置是针对 springdoc 2.x 编写的，与 springdoc 3.0.3 存在 API 冲突：
      #   NoSuchMethodError: SpringDocConfigProperties.getGroupConfigs()
      # 这里仅排除其自动配置，Knife4j 的增强 UI（/doc.html）来自静态 webjar，不受影响；
      # 接口元数据仍由 springdoc 3.0.3 生成（/v3/api-docs）。
      - com.github.xiaoymin.knife4j.spring.configuration.Knife4jAutoConfiguration
      - com.github.xiaoymin.knife4j.spring.configuration.insight.Knife4jInsightAutoConfiguration
  datasource:
    dynamic:
      enabled: true
      primary: master
      strict: false
      lazy: false
      graceful-shutdown: true
      health:
        enabled: true
      datasource:
        master:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:owner}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
          username: ${MYSQL_USERNAME:root}
          password: ${MYSQL_PASSWORD:}
      # Druid 全局参数
      druid:
        initial-size: 5
        min-idle: 5
        max-active: 20
        max-wait: 60000
        time-between-eviction-runs-millis: 60000
        min-evictable-idle-time-millis: 300000
        max-evictable-idle-time-millis: 900000
        validation-query: SELECT 1
        validation-query-timeout: 5
        test-while-idle: true
        test-on-borrow: false
        test-on-return: false
        pool-prepared-statements: true
        max-pool-prepared-statement-per-connection-size: 20
        keep-alive: true
        phy-max-use-count: 1000
        connection-error-retry-attempts: 3
        break-after-acquire-failure: false
        filters: stat,wall,slf4j
        connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=3000
        wall:
          multi-statement-allow: true
          none-base-statement-allow: true

  # ------------------------------------------------------------------
  # 缓存：Spring Cache = REDIS
  # 序列化用 Spring Data Redis 自带的 Jackson 3 实现（GenericJacksonJsonRedisSerializer）
  # ------------------------------------------------------------------
  cache:
    type: redis
    redis:
      time-to-live: 2h
      cache-null-values: false
      use-key-prefix: true
      key-prefix: "owner:cache:"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 注意：Redis 无密码时请不要保留 password 配置项。
      # 空字符串会让 Redisson 仍然发送 AUTH 命令而连接失败；
      # 需要密码时设置环境变量 SPRING_DATA_REDIS_PASSWORD，或在对应 profile 中显式配置。
      database: ${REDIS_DATABASE:0}
      timeout: 10s
      connect-timeout: 5s
      client-type: lettuce
      lettuce:
        shutdown-timeout: 200ms
        pool:
          enabled: true
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 5s
          time-between-eviction-runs: 30s

  # ------------------------------------------------------------------
  # 定时任务：Quartz + JDBC JobStore
  # ------------------------------------------------------------------
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    auto-startup: true
    wait-for-jobs-to-complete-on-shutdown: true
    overwrite-existing-jobs: false
    properties:
      org.quartz.scheduler.instanceName: OwnerScheduler
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.scheduler.skipUpdateCheck: true
      org.quartz.scheduler.batchTriggerAcquisitionMaxCount: 10
      # 不要指定 org.quartz.jobStore.class：
      # 留空时 Spring 使用 LocalDataSourceJobStore，才能复用 Spring 管理的 DataSource；
      # 若改成 JobStoreTX 会抛出 "DataSource name not set"。
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
      org.quartz.jobStore.tablePrefix: QRTZ_
      org.quartz.jobStore.isClustered: true
      org.quartz.jobStore.clusterCheckinInterval: 15000
      org.quartz.jobStore.misfireThreshold: 60000
      org.quartz.jobStore.useProperties: false
      org.quartz.threadPool.class: org.quartz.simpl.SimpleThreadPool
      org.quartz.threadPool.threadCount: 10

# ======================================================================
#  ORM：MyBatis 3.5.19 + MyBatis-Plus 3.5.16
# ======================================================================
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.owner.system.domain.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    default-statement-timeout: 30
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      table-underline: true
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
      insert-strategy: not_null
      update-strategy: not_null

# ======================================================================
#  接口文档：Knife4j 4.5.0 + springdoc 3.0.3
# ======================================================================
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    disable-swagger-default-url: true
  default-produces-media-type: application/json
  packages-to-scan: com.owner

knife4j:
  enable: true
  production: false
  basic:
    enable: false
  setting:
    language: zh_cn
    enable-footer: false
    enable-footer-custom: false
    enable-open-api: false
    enable-swagger-models: true
    swagger-model-name: 数据模型
    enable-after-script: false
    enable-group-dropdown: true
    enable-version: false

# ======================================================================
#  OWNER 自定义配置
# ======================================================================
owner:
  app:
    version: 2026.03-SNAPSHOT
  web:
    cors:
      allowed-origins: "*"
  druid:
    monitor:
      enabled: true
      login-username: ${OWNER_DRUID_MONITOR_USERNAME:admin}
      login-password: ${OWNER_DRUID_MONITOR_PASSWORD:change-me}
  thread-pool:
    core-size: 8
    max-size: 32
    queue-capacity: 1000
    keep-alive-seconds: 60

  # ------------------------------------------------------------------
  #  登录令牌（自实现 HS256 JWT）
  # ------------------------------------------------------------------
  auth:
    jwt:
      # 生产环境务必用环境变量 OWNER_JWT_SECRET 覆盖；不设置时用内置开发密钥并打 WARN
      secret: ${OWNER_JWT_SECRET:owner-mall-dev-secret-please-override-in-production}
      # 默认 7 天；退出登录会把当前 jti 拉黑，令牌随即失效
      expire-seconds: ${OWNER_JWT_EXPIRE_SECONDS:604800}

  # ------------------------------------------------------------------
  #  电商（日用铺）
  # ------------------------------------------------------------------
  mall:
    # 首次启动补齐：koko 的平台管理员密码、店主账号、「日用铺」店铺、五个一级类目
    bootstrap:
      enabled: true
      admin-password: ${OWNER_BOOTSTRAP_ADMIN_PASSWORD:koko@2026}
      shop-name: 日用铺
      # 售后退货默认用这个地址，店主应在「店铺资料」里改成真实发货地址
      ship-address: ${OWNER_BOOTSTRAP_SHIP_ADDRESS:广东省深圳市南山区科技园 1 号 101 室（示例地址，请店主改成真实发货地址）}
      # 默认店主就是平台超管 koko：一个人跑通「开店 → 上架 → 下单」全流程，不再另建 shopadmin
      owner-username: ${OWNER_BOOTSTRAP_OWNER_USERNAME:koko}
      owner-password: ${OWNER_BOOTSTRAP_OWNER_PASSWORD:koko@2026}
      owner-mobile: ${OWNER_BOOTSTRAP_OWNER_MOBILE:17535306390}
    sms:
      # 未接短信通道，验证码只写日志。true 时把验证码随响应返回给前端，仅供本地联调，生产必须 false
      expose-code: false
    # 图片上传：默认存本地磁盘，通过 /files/** 直接访问，不依赖任何对象存储
    upload:
      # 相对路径以启动目录为基准；生产建议改成挂载盘绝对路径，例如 /data/owner/uploads
      dir: ${OWNER_UPLOAD_DIR:./uploads}
      # 对外访问前缀，前端开发服务器已代理该前缀
      public-prefix: /files
      # 单张图片上限（字节），默认 5 MB
      max-image-size: 5242880
    order:
      # 未接入在线支付：订单停在「待确认」，由商家线下收款后点「确认收款」，
      # 因此默认不做过期自动取消（否则订单会在商家确认前被脚本取消）
      timeout-job:
        enabled: ${OWNER_ORDER_TIMEOUT_ENABLED:false}
      # 每天 02:10 把发货满 7 天的待收货订单改为已完成
      auto-finish-job:
        enabled: true

# ======================================================================
#  Actuator
# ======================================================================
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,threaddump,loggers
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    redis:
      enabled: true
    db:
      enabled: true
  info:
    java:
      enabled: true
    env:
      enabled: true

# ======================================================================
#  日志
# ======================================================================
logging:
  config: classpath:logback-spring.xml
  level:
    root: info
    com.owner: debug
    com.baomidou.dynamic.datasource: info
